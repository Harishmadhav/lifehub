{% extends "base.html" %}

{% block title %}Create Note - LifeHub{% endblock %}

{% block content %}
    <h1>Create a New Note</h1>

    <div class="card" style="max-width: 500px;">
        <form method="POST">
            {{ form.hidden_tag() }}

            <div class="field">
                {{ form.title.label }}
                {{ form.title() }}
            </div>

            <div class="field">
                {{ form.content.label }}
                {{ form.content(rows=8) }}
            </div>

            {{ form.submit() }}
        </form>
    </div>

    <p><a href="{{ url_for('notes.view_notes') }}">← Back to My Notes</a></p>
{% endblock %}
