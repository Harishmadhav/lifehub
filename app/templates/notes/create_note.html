<!DOCTYPE html>
<html>
<head>
    <title>Create Note - LifeHub</title>
</head>
<body>
    <h2>Create a New Note</h2>

    <form method="POST">
        {{ form.hidden_tag() }}

        <p>
            {{ form.title.label }}<br>
            {{ form.title() }}
        </p>

        <p>
            {{ form.content.label }}<br>
            {{ form.content(rows=8, cols=50) }}
        </p>

        {{ form.submit() }}
    </form>

    <p><a href="{{ url_for('notes.view_notes') }}">Back to My Notes</a></p>
</body>
</html>
