<!DOCTYPE html>
<html>
<head>
    <title>Analytics - LifeHub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
    <h1>Productivity Analytics</h1>
    <p><a href="{{ url_for('main.dashboard') }}">Back to Dashboard</a></p>

    <hr>

    <h3>Quick Stats</h3>
    <p>Completed Tasks: {{ completed_tasks }}</p>
    <p>Pending Tasks: {{ pending_tasks }}</p>
    <p>Total Notes: {{ total_notes }}</p>
    <p>Total Habits Tracked: {{ habit_names|length }}</p>

    <hr>

    <h3>Tasks: Completed vs Pending</h3>
    <div style="max-width: 400px;">
        <canvas id="taskChart"></canvas>
    </div>

    <hr>

    <h3>Habit Streaks</h3>
    <div style="max-width: 500px;">
        <canvas id="habitChart"></canvas>
    </div>

    <script>
        // Task pie chart
        const taskCtx = document.getElementById('taskChart').getContext('2d');
        new Chart(taskCtx, {
            type: 'pie',
            data: {
                labels: ['Completed', 'Pending'],
                datasets: [{
                    data: [{{ completed_tasks }}, {{ pending_tasks }}],
                    backgroundColor: ['#4CAF50', '#FF9800']
                }]
            }
        });

        // Habit streak bar chart
        const habitCtx = document.getElementById('habitChart').getContext('2d');
        new Chart(habitCtx, {
            type: 'bar',
            data: {
                labels: {{ habit_names|tojson }},
                datasets: [{
                    label: 'Current Streak',
                    data: {{ habit_streaks|tojson }},
                    backgroundColor: '#2196F3'
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { stepSize: 1 }
                    }
                }
            }
        });
    </script>
</body>
</html>
